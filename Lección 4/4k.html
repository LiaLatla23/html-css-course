<style>
  .stretch-button {
    background-color: green;
    color:white;
    border: none;
    font-size: 18px;
    padding: 8px 15px;
    cursor: pointer;
    margin-left: 10px;
    margin-right: 10px;
    transition: padding 0.15s,
    margin 0.15s;
  }

  .stretch-button:hover {
    padding: 8px 25px;
    margin-left: 0px;
    margin-right: 0px;
  }

</style>

<button class="stretch-button">
  One
</button>

<button class="stretch-button">
  Two
</button>

<button class="stretch-button">
  Three
</button>
