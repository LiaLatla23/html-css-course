<!DOCTYPE html>
<html>
    <head>
      <title>Google.com Clone</title>

      <style>
        .google-logo {
          width: 200px;
          display: block;
          margin: auto;
          margin-bottom: 0px;
        }

        .search-bar {
          width: 350px;
          border-radius: 20px;
          padding: 8px;
          border-style:solid;
          border-color: rgb(220, 220, 220);
          box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.15);
          font-size: 12px;
          cursor: pointer;
          display: block;
          margin: auto;
          margin-top: 0px;
      }

      </style>

    </head>
    <body>
      <img class="google-logo" src="images.webp" alt="Google Logo">
      <input class="search-bar" type="text" placeholder="Search Google or type a URL">
    </body>
</html>
