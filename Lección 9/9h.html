<!DOCTYPE html>
<html>
  <head>
    <title>Google.com Clone</title>

    <style>
      .google-logo {
        width: 200px;
        margin: auto;
        margin-bottom: 0px;
        margin-top: 50px;
      }

      .search-bar {
        width: 350px;
        border-radius: 20px;
        padding: 10px;
        border-style: solid;
        border-color: rgb(220, 220, 220);
        box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.15);
        font-size: 14px;
        cursor: pointer;
        margin: auto;
        margin-top: 10px;
      }

      .google-search,
      .feeling-lucky {
        background-color: rgb(240, 240, 240);
        border: none;
        border-radius: 5px;
        padding: 10px 20px;
        font-size: 14px;
        cursor: pointer;
        display: inline-block;
        margin-top: 25px;
        margin-right: 8px;
      }

      div {
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div>
      <img class="google-logo" src="download.png" alt="Google Logo">
    </div>

    <div>
      <input
        class="search-bar"
        type="text"
        placeholder="Search Google or type a URL"
      >
    </div>

    <div>
      <button class="google-search">
        Google Search
      </button>

      <button class="feeling-lucky">
        I'm Feeling Lucky
      </button>
    </div>
  </body>
</html>
