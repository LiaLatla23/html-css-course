
<style>
  .Apply-button {
    background-color: rgb(10, 102, 194);
    color: white;
    height: 36px;
    width: 200px;
    border-radius: 18px;
    border: none;
    margin-right: 8px;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    transition: background-color 0.15s;
  }

  .Apply-button:hover {
    background-color:rgb(13, 73, 132);

  }

  .save-button {
    background-color: white;
    color: rgb(10, 102, 194);
    border-radius: 18px;
    height: 36px;
    width: 80px;
    font-weight: bold;
    font-size: 13px;
    border-style: solid;
    border-width: 1px;
    border-color: rgb(10, 102, 194);
    cursor: pointer;
    transition: background-color 0.15s, border-width 0.15s;
  }

  .save-button:hover {
    background-color: rgb(223, 238, 255);
    border-width: 2px;
  }

</style>



<button class="Apply-button">
  Apply on company website
</button>


<button class="save-button">
  Save
</button>
