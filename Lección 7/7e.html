<!DOCTYPE html>
<html>
  <head>
    <title>Google Search Bar</title>

    <style>
      .search-bar {
        width: 350px;
        border-radius: 20px;
        padding: 8px;
        border-style:solid;
        border-color: rgb(220, 220, 220);
        box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.15);
        font-size: 12px;
        cursor: pointer;
      }
    </style>

  </head>

  <body>
    <input class="search-bar" placeholder="Search Google or type a URL">
  </body>

</html>
