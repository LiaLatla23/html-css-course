<!DOCTYPE html>
<html>
  <head>
    <title>
      Twitter text box
    </title>
    <link
      rel="stylesheet" href="images.jpg"
    />

    <style>
      .pfp {
        width: 50px;
        border-radius: 100%;
        vertical-align: middle;
      }

      .message {
        width: 200px;
        padding: 8px;
        border: none;
        font-size: 14px;
      }

      .tweet {
        border-radius: 20px;
        width: 65px;
        height: 30px;
        color: white;
        background-color: #1da1f2;
        border: none;
        font-weight: bold;
        cursor: pointer;
      }

    </style>

  </head>
  <body>
    <img class="pfp" src="images.jpg"/>
    <input class="message" type="text" placeholder="What's happening?"/>
    <button class="tweet">Tweet</button>
  </body>
</html>
