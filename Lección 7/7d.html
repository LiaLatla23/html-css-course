<!DOCTYPE html>
<html>
  <head>
    <title>
      Search bar
    </title>

    <style>
      .search-bar {
        font-size: 20px;
        border-radius: 6px;
        border-style: solid;
        border-color: rgb(171, 171, 171);
        padding: 10px;
        width: 200px;
        border-width: 2px;
        cursor: pointer;
      }
    </style>

  </head>
  <body>
    <input class="search-bar" placeholder="Search">
  </body>
</html>
