<!DOCTYPE html>
<html>
  <head>
    <title>LinkedIn signup</title>

    <style>
      p {
        font-family: Arial;
        margin-top: 0px;
        margin-bottom: 0px;
        font-size: 12px;
      }

      .email {
        color: rgb(100, 100, 100);
        margin-bottom: 5px;
      }

      .signup-bar {
        width: 290px;
        padding: 3px;
        margin-bottom: 12px;
        border-radius:4px;
        border-width: 2px;
        border-style: solid;
        border-color: rgb(100, 100, 100);
      }

      .terms {
        color:rgb(100, 100, 100);
        margin-bottom: 15px;
      }

      .agree-join {
        background-color: rgb(10, 102, 194);
        color: white;
        padding: 12px;
        border-style: solid;
        border-radius: 25px;
        border-color: gray;
        border-width: 1px;
        width: 300px;
        text-align: center;
        cursor: pointer;
      }

    </style>

  </head>

  <body>
    <p class="email">
      Email
    </p>
    <input class="signup-bar">
    <p class="terms">
      By clicking Agree & Join, you agree to the Privacy Policy.
    </p class="agree-join">
    <button class="agree-join">
      Agree & Join
    </button>
  </body>
</html>
