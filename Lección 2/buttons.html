
<style>
  .subscribe-button {
    background-color: rgb(200, 4, 4);
    color: white;
    border: none;
    height: 36px;
    width: 105px;
    border-radius: 2px;
    cursor: pointer;
    margin-right: 8px;
  }
</style>

<style>
  .join-button {
    background-color: white;
    border-color: rgb(0, 102, 255);
    color: rgb(0, 102, 255);
    border-style: solid;
    border-width: 1px;
    width: 62px;
    height: 36px;
    border-radius: 2px;
    cursor: pointer;
    margin-right: 8px;
  }

  .tweet-button {
    background-color: rgb(66, 178, 219);
    color: white;
    border: none;
    height: 36px;
    width: 70px;
    border-radius: 18px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
  }
</style>


<button class = "subscribe-button">
  SUBSCRIBE
</button>

<button class = "join-button">
  JOIN
</button>

<button class = "tweet-button">
  Tweet
</button>
